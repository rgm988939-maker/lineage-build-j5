name: Build LineageOS 64-bit for Galaxy J5

on:
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою з веб-інтерфейсу GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/doc
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip zip

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Init and Sync Sources
      run: |
        mkdir lineage && cd lineage
        git config --global user.name "igor"
        git config --global user.email "igor@example.com"
        
        # Ініціалізація сирців LineageOS
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs
        
        # Клонування локального маніфесту з деревом пристрою J5
        mkdir -p .repo/local_manifests
        # Сюди додається ваш local_manifest.xml з репозиторіями j5x3g / msm8916-mainline
        
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Build ROM
      run: |
        cd lineage
        source build/envsetup.sh
        lunch lineage_j5x3g-userdebug
        mka bacon -j$(nproc)

    - name: Upload ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-J5-64bit
        path: lineage/out/target/product/j5x3g/*.zip 
